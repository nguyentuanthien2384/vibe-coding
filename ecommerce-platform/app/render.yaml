services:
  # =============================================================================
  # 1. TechBite Backend API (NestJS + Prisma + MariaDB Driver)
  # =============================================================================
  - type: web
    name: techbite-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: ecommerce-platform/app/backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: (npx prisma db push || true) && (npm run db:seed || true) && (npm run db:create-admin || true) && npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Điền connection string TiDB: mysql://user:pass@host:4000/test?sslaccept=strict
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        sync: false # Điền Redis URI từ Upstash (hoặc để trống để tự động fallback In-Memory)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Nhập domain frontend/admin nếu host trên Vercel hoặc domain tuỳ chỉnh
      - key: FRONTEND_URL
        value: https://techbite-frontend.onrender.com
      - key: ADMIN_URL
        value: https://techbite-dash.onrender.com

  # =============================================================================
  # 2. TechBite Frontend (Next.js Customer App)
  # =============================================================================
  - type: web
    name: techbite-frontend
    runtime: node
    plan: free
    region: singapore
    rootDir: ecommerce-platform/app/frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://techbite-backend.onrender.com

  # =============================================================================
  # 3. TechBite Admin Dashboard (Next.js Admin App)
  # =============================================================================
  - type: web
    name: techbite-dash
    runtime: node
    plan: free
    region: singapore
    rootDir: ecommerce-platform/app/dash/my-app
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://techbite-backend.onrender.com
